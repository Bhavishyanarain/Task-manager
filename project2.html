
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Manager</title>
    <link rel="stylesheet" href="project2.css">
</head>
<body>

    <div class="container">
        <h1>My To-Do List</h1>
        <p class="subtitle">Organize your tasks and stay productive!</p>

        <div class="task-input">
            <input type="text" id="taskInput" placeholder="Enter a new task">
            <button id="addBtn">Add Task</button>
        </div>

        <div class="stats">
            <div>
                <h3 id="totalTasks">0</h3>
                <p>Total Tasks</p>
            </div>
            <div>
                <h3 id="pendingTasks">0</h3>
                <p>Pending</p>
            </div>
            <div>
                <h3 id="completedTasks">0</h3>
                <p>Completed</p>
            </div>
        </div>

        <div class="filters">
            <button class="filter active" data-filter="all">All</button>
            <button class="filter" data-filter="pending">Pending</button>
            <button class="filter" data-filter="completed">Completed</button>
        </div>

        <ul id="taskList"></ul>

        <button id="clearCompleted">Clear Completed Tasks</button>
    </div>

    <script src="project java 2.js"></script>
</body>
</html>
